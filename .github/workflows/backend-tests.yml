name: Backend Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # We need a Postgres service to run our tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpassword
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Enable pgvector extension
      env:
        PGPASSWORD: ragpassword
      run: |
        psql -h localhost -U raguser -d ragdb -c "CREATE EXTENSION IF NOT EXISTS vector;"

    - name: Run tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql+psycopg2://raguser:ragpassword@localhost:5432/ragdb
        JWT_SECRET_KEY: test-secret-key-for-ci
        GROQ_API_KEY: dummy-key-for-tests
      run: |
        pytest tests/ -v